[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spacecraft-telemetry-copilot"
version = "0.1.0"
description = "MCP Copiloto de Monitoramento de Telemetria Espacial — ESA-ADB"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[mcp_servers.spacecraft-telemetry]
command = "/home/mel/Documents/projetos/spacecraft-telemetry-anomaly-detection/.venv/bin/python"
args = ["-m", "src.mcp.server"]
cwd = "/home/mel/Documents/projetos/spacecraft-telemetry-anomaly-detection"
enabled = true